name: 构建并部署到 Cloudflare Workers
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不传 version：自动读取 package.json 的 packageManager（pnpm@9.14.4）。
      # 必须停留在 pnpm 9.x —— patches/astro.patch 依赖 pnpm.patchedDependencies 生效，
      # pnpm 10+ 已不再读取 package.json 中的该字段，会导致补丁静默失效。
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # 必须是 22+：wrangler 4 要求 Node >= 22，用 20 会让 wrangler-action 的版本探测
      # 失败，进而静默回退安装 wrangler@3.90.0（读不懂 assets-only 配置，报 Missing entry-point）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # 显式钉住大版本，避免探测失败时回退到 wrangler 3
          wranglerVersion: '4'
